[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matplotlib-dark"
version = "0.1.0"
description = "Automatic dark themes for Matplotlib, with one-line activation"
readme = "README.md"
authors = [
    {name = "Eduardo J. Barrios", email = "edujbarrios@outlook.com"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = ["matplotlib", "dark-mode", "visualization", "plotting", "theme"]
dependencies = [
    "matplotlib>=3.5.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
test = [
    "pytest>=7",
]
dev = [
    "build>=1",
    "pytest>=7",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/edujbarrios/matplotlib-dark"
Documentation = "https://github.com/edujbarrios/matplotlib-dark#readme"
Repository = "https://github.com/edujbarrios/matplotlib-dark"
Issues = "https://github.com/edujbarrios/matplotlib-dark/issues"
Changelog = "https://github.com/edujbarrios/matplotlib-dark/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matplotlib_dark = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
